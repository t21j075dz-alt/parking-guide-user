name: User app regression checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js && node --check voice-guide-scripts.js && node --check voice-audio-cache.js && node --check live-status.js && node --check recorded-demo.js
      - name: Run user-app tests
        run: node --test tests/*.test.cjs
